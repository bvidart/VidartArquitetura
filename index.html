<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>VA Arquitetura e Interiores — Descoberta Estética & Briefing</title>
  <meta name="description" content="Experiência interativa de descoberta estética e levantamento de necessidades arquitetônicas — VA Arquitetura e Interiores." />
  <meta property="og:title" content="VA Arquitetura e Interiores — Descoberta Estética" />
  <meta property="og:description" content="Todo espaço começa com uma forma única de sentir. Descubra os detalhes que tornam um ambiente verdadeiramente seu." />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#F6F2EC" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44' fill='none'%3E%3Crect width='44' height='44' rx='10' fill='%23F6F2EC'/%3E%3Cpath d='M7 39V21C7 12.7157 13.7157 6 22 6C30.2843 6 37 12.7157 37 21V39' stroke='%23967751' stroke-width='1.5'/%3E%3Cpath d='M13.5 17L19.5 32.5L25.5 17' stroke='%23221E1A' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M21.5 32.5L26.8 17L31.8 32.5' stroke='%23967751' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- TOPBAR: Identidade VA preservada + indicador duplo de progresso (Etapa 05/08 · 1/2) -->
  <header class="topbar" id="topbar">
    <div class="container topbar__inner">
      <button type="button" class="brand-mark" id="brandHomeBtn" aria-label="VA Arquitetura e Interiores — Voltar ao início">
        <svg class="brand-mark__emblem" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M5 41V21C5 11.6112 12.6112 4 22 4C31.3888 4 39 11.6112 39 21V41" stroke="#967751" stroke-width="1.2" />
          <path d="M12.5 16.5L19.2 33.5L25.8 16.5" stroke="#221E1A" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M21.5 33.5L27.4 16.5L32.8 33.5" stroke="#967751" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" />
          <line x1="24.2" y1="27.2" x2="30.6" y2="27.2" stroke="#967751" stroke-width="1.1" />
        </svg>
        <span class="brand-mark__text">
          <span class="brand-mark__va">VA</span>
          <span class="brand-mark__divider" aria-hidden="true"></span>
          <span class="brand-mark__sub">Arquitetura e<br />Interiores</span>
        </span>
      </button>

      <div class="topbar__chapter" id="topbarChapter" hidden>
        <span class="chapter-pill" aria-live="polite">
          <span class="chapter-pill__num" id="chapterCode">01/08</span>
          <span id="chapterName">Início</span>
          <span class="chapter-pill__sub" id="chapterSub" hidden>1/2</span>
        </span>
      </div>

      <div class="topbar__actions">
        <button type="button" class="topbar__ghost-btn" id="openAdminBtn" title="Área privada da equipe de arquitetura" aria-label="Área da equipe">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <span>Equipe</span>
        </button>
      </div>
    </div>
    <div class="topbar__progress" id="progressBar" aria-hidden="true"></div>
  </header>

  <!-- PALCO PRINCIPAL (1 pergunta principal por tela) -->
  <main class="journey-main is-welcome" id="journeyMain" aria-live="polite">
    <div class="container" id="stageContainer"></div>
  </main>

  <!-- BARRA DE NAVEGAÇÃO CONSISTENTE (Voltar / OK, continuar) -->
  <nav class="journey-bar" id="journeyBar" aria-label="Navegação entre etapas" hidden>
    <div class="container journey-bar__inner">
      <button type="button" class="btn-secondary" id="prevStepBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
        <span>Voltar</span>
      </button>

      <div class="journey-bar__meta" id="journeyMeta">Salvo automaticamente</div>

      <div class="journey-bar__right">
        <button type="button" class="btn-primary" id="nextStepBtn">
          <span id="nextStepLabel">Continuar</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14M12 5l7 7-7 7" />
          </svg>
        </button>
      </div>
    </div>
  </nav>

  <!-- MODAL LIGHTBOX (Ampliar & Comparar) -->
  <div class="modal-backdrop" id="lightboxModal" role="dialog" aria-modal="true" aria-labelledby="lightboxTitle" hidden>
    <div class="lightbox-dialog">
      <div class="lightbox-dialog__img-wrap">
        <button type="button" class="lightbox-nav lightbox-nav--prev" id="lightboxPrevBtn" aria-label="Imagem anterior" hidden>‹</button>
        <img id="lightboxImg" src="" alt="" />
        <button type="button" class="lightbox-nav lightbox-nav--next" id="lightboxNextBtn" aria-label="Próxima imagem" hidden>›</button>
      </div>
      <div class="lightbox-dialog__foot">
        <div class="lightbox-dialog__info">
          <h3 class="choice-card__title" id="lightboxTitle"></h3>
          <p class="choice-card__desc" id="lightboxDesc"></p>
        </div>
        <div class="lightbox-dialog__actions">
          <button type="button" class="btn-primary" id="lightboxSelectBtn" hidden>Selecionar</button>
          <button type="button" class="btn-secondary" id="lightboxCloseBtn">Fechar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- PAINEL INTERNO PRIVADO DA EQUIPE VIDART -->
  <div class="modal-backdrop" id="adminModal" role="dialog" aria-modal="true" aria-labelledby="adminModalTitle" hidden>
    <div class="admin-shell">
      <div class="admin-header">
        <div>
          <span class="eyebrow" style="margin-bottom:0.2rem;color:var(--bronze-light);">Área Privada · VA Arquitetura</span>
          <h2 id="adminModalTitle" style="font-family:var(--font-display);font-weight:400;font-size:1.65rem;">Painel de Briefings & Necessidades</h2>
        </div>
        <button type="button" class="btn-secondary" id="adminCloseBtn" style="color:var(--ink-light);border-color:var(--hairline-dark);">Fechar</button>
      </div>
      <div class="admin-body" id="adminBody"></div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="checklist.js"></script>
  <script src="storage.js"></script>
  <script src="app.js"></script>
</body>
</html>
